# Print-start policy. No commands run automatically from this file.
[gcode_macro _START_POLICY]
# Provisional stability thresholds; verify Bed2 traces after a cold PLA/ASA start.
variable_window: 30
variable_bed2_slope: 0.5
variable_bed2_range: 0.5
variable_pla_min: 30
variable_asa_min: 180
variable_repeat_valid: 0
variable_last_bed: 0
variable_last_chamber: 0
variable_last_chamber_actual: 0
gcode:
  {action_respond_info("Start policy: Bed2 stability, explicit FAST repeat, AFC thermal ownership")}

[gcode_macro _START_SOAK_INIT]
gcode:
  # Separate macro: evaluated AFTER blocking M190, not before heating.
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=bed2_history VALUE=[]
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pwm_sum VALUE=0
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=sample_count VALUE=0
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_elapsed VALUE=0

[gcode_macro _START_SOAK_SAMPLE]
gcode:
  {% set start = printer['gcode_macro PRINT_START'] %}
  {% set policy = printer['gcode_macro _START_POLICY'] %}
  {% set elapsed = start.soak_elapsed|int + 1 %}
  {% set history = (start.bed2_history + [printer['temperature_sensor Bed2'].temperature|float])[-(policy.window|int + 1):] %}
  {% set count = start.sample_count|int + 1 %}
  {% set total = start.pwm_sum|float + printer.heater_bed.power|float %}
  {% set avg = total / count %}
  {% set full = history|length >= policy.window|int + 1 %}
  {% set slope = (history[-1] - history[0])|abs * 60.0 / policy.window|float %}
  {% set span = history|max - history|min %}
  {% set stable = start.soak_mode == 'pwm' or (full and slope <= policy.bed2_slope|float and span <= policy.bed2_range|float) %}
  {% set warm = printer.heater_bed.temperature >= start.bed|float - 1 and printer['temperature_fan chamber'].temperature >= start.chamber_min|float %}
  {% set done = elapsed >= start.soak_min|int and avg < start.soak_threshold|float and stable and warm %}
  {% if elapsed >= start.soak_max_time|int and not done %}
    # Keep virtual SD paused; user can cancel and inspect rather than print cold.
    {action_raise_error("Heat soak timed out: check Bed2/chamber or explicitly choose SOAK_MODE=pwm on a new start")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=bed2_history VALUE="{history}"
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=soak_elapsed VALUE={elapsed}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pwm_sum VALUE={total}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=sample_count VALUE={count}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=avg_pwm VALUE={avg}
  M117 Soak {elapsed}s PWM{(avg*100)|round|int}% Bed2 {slope|round(2)}C/min
  {% if done %}
    _PRINT_AR T="Heat soak ready: Bed2 slope {slope|round(2)}C/min, PWM {(avg*100)|round|int}%"
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE='"QGL"'
  {% elif count >= policy.window|int %}
    # PWM uses consecutive short windows instead of averaging the whole warmup.
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pwm_sum VALUE=0
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=sample_count VALUE=0
  {% endif %}
  UPDATE_DELAYED_GCODE ID=START_PRINT_WAIT DURATION=1

[gcode_macro _START_LEVEL]
gcode:
  {% set start = printer['gcode_macro PRINT_START'] %}
  {% set fast = start.fast_eligible|int == 1 and printer.quad_gantry_level.applied and 'xyz' in printer.toolhead.homed_axes and (printer.heater_bed.temperature - start.bed|float)|abs <= 2 %}
  BED_MESH_CLEAR
  {% if fast %}
    _PRINT_AR T="Explicit warm repeat: reuse QGL; fresh Touch and mesh still required"
  {% else %}
    G32
  {% endif %}

[gcode_macro _START_PARALLEL_HEAT]
gcode:
  {% set start = printer['gcode_macro PRINT_START'] %}
  {% set afc = printer.AFC %}
  {% set lane_key = 'AFC_stepper ' + (afc.current_load|default('', true)) %}
  {% set transition = printer.afc_material_transition %}
  {% set ns = namespace(ok=false) %}
  {% if lane_key in printer and transition.active == none and transition.state.stage == 'ready' and not afc.error_state and not afc.bypass_state %}
    {% set lane = printer[lane_key] %}
    {% set residue = transition.state.residue %}
    {% set ns.ok = lane.tool_loaded and lane.load and lane.prep and lane.map == 'T' + start.initial_tool|string and residue|length == 1 and residue[0].material|upper == lane.material|upper and (residue[0].temperature|float - lane.extruder_temp|float)|abs <= 5 and (start.extruder|float - lane.extruder_temp|float)|abs <= 15 %}
  {% endif %}
  {% if ns.ok %}
    _START_PID_SELECT TARGET={start.extruder}
    M104 S{start.extruder}
  {% else %}
    _PRINT_AR T="Parallel nozzle heat withheld: AFC will validate/load the selected tool"
  {% endif %}
  # Always execute T later, even when already loaded: transition failure checks matter.

[gcode_macro _START_PID_SELECT]
gcode:
  {% set target = params.TARGET|float %}
  {% if target >= 200 and target <= 230 %}
    PID_PROFILE HEATER=extruder LOAD=pla_220 DEFAULT=default KEEP_TARGET=1 VERBOSE=silent
  {% else %}
    PID_PROFILE HEATER=extruder LOAD=default KEEP_TARGET=1 VERBOSE=silent
  {% endif %}

[gcode_macro _START_REPEAT_READY]
gcode:
  {% set start = printer['gcode_macro PRINT_START'] %}
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=last_bed VALUE={start.bed}
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=last_chamber VALUE={start.chamber}
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=last_chamber_actual VALUE={printer['temperature_fan chamber'].temperature}
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=1

[gcode_macro PREHEAT_MATERIAL]
description: Explicit idle preheat MATERIAL=PLA/ASA/ABS; nozzle stays Touch-safe
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("Preheat is unavailable during printing/paused print")}
  {% endif %}
  {% set material = params.MATERIAL|default('PLA')|upper %}
  {% if material not in ['PLA', 'ASA', 'ABS'] %}
    {action_raise_error("Supported preheats: PLA, ASA, ABS")}
  {% endif %}
  {% set bed = params.BED|default(65 if material == 'PLA' else 105)|float %}
  {% set chamber = params.CHAMBER|default(0 if material == 'PLA' else 55)|float %}
  {% set fans = params.FANS|default(0 if material == 'PLA' else 0.35)|float %}
  {% if fans < 0 or fans > 1 %}
    {action_raise_error("Preheat FANS uses 0..1")}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_POWER_OFF_PRINTER DURATION=0
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=0
  M140 S{bed}
  M104 S147.5
  M141 S{chamber}
  SET_FAN_SPEED FAN=inner_fans SPEED={fans}
  SET_FAN_SPEED FAN=outer_fans SPEED={fans}

[gcode_macro CALIBRATE_PLA_PID]
description: Idle-only PLA PID; requires physically empty hotend, does not SAVE_CONFIG
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] or printer.afc_material_transition.active != none or printer.AFC.current_load %}
    {action_raise_error("PID calibration requires idle printer and unloaded AFC")}
  {% endif %}
  {% if params.EMPTY_HOTEND|default(0)|int != 1 %}
    {action_raise_error("Physically empty hotend first, then EMPTY_HOTEND=1")}
  {% endif %}
  {% set fan = params.FAN|default(1)|float %}
  {% if fan < 0 or fan > 1 %}
    {action_raise_error("FAN must be 0..1")}
  {% endif %}
  {% set old_fan = printer.fan.speed %}
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=0
  M106 S{(fan*255)|round|int}
  # Heater fan retains the existing 0.7 limit and turns on automatically.
  PID_CALIBRATE HEATER=extruder TARGET=220 PROFILE=pla_220 WRITE_FILE=1
  M104 S0
  M106 S{(old_fan*255)|round|int}
  _PRINT_AR T="PLA PID measured for this session. Validate heating/settling; SAVE_CONFIG only when idle and ready to restart."

[gcode_macro M84]
rename_existing: M1084
gcode:
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=0
  M1084 {rawparams}

[gcode_macro M18]
rename_existing: M1018
gcode:
  SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=0
  M1018 {rawparams}

[gcode_macro SET_STEPPER_ENABLE]
rename_existing: SET_STEPPER_ENABLE_BASE_START
gcode:
  {% if params.STEPPER|default('')|lower in ['stepper_z', 'stepper_z1', 'stepper_z2', 'stepper_z3'] and params.ENABLE|default(1)|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_START_POLICY VARIABLE=repeat_valid VALUE=0
  {% endif %}
  SET_STEPPER_ENABLE_BASE_START {rawparams}
