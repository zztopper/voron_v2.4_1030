# Local extension; does not modify the upstream AFC installation.
[afc_material_transition]
flush_length: 80
flush_speed: 2
load_speed: 5
finish_length: 25
cooling_retract: 1
# Short transition ceilings, not recommended printing temperatures.
# Verify these ceilings against each filament manufacturer's specification.
# Unknown materials can only transition at their configured nozzle temperature.
# PA/GF66 must have an explicit nozzle temperature in Spoolman.
transition_limits: PLA:270, PETG:285, ABS:310, ASA:310, TPU:240
